# Sobe UMA versão da API por vez (python OU ruby) para ela ter a máquina toda.
# Ajuste os contextos de build em .env (ver README).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Servidor de páginas-alvo local: elimina variação de internet/rede externa
  fixture:
    image: nginx:alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html/p:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  api-python:
    build: ${PY_API_CONTEXT:-./linkextractor/api}
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["5000:5000"]
    cpus: ${API_CPUS:-2}
    mem_limit: ${API_MEM:-1g}
    depends_on: [redis, fixture]

  api-ruby:
    build: ${RUBY_API_CONTEXT:-./linkextractor/api-ruby}
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["4567:4567"]
    cpus: ${API_CPUS:-2}
    mem_limit: ${API_MEM:-1g}
    depends_on: [redis, fixture]
